<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#246b5f">
    <meta name="description" content="Lekka aplikacja do ćwiczeń logopedycznych.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/images/pa_papuga.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./app.css">
    <title>Logopeda</title>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./" data-route aria-label="Logopeda, strona główna">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>Logopeda</span>
      </a>
      <div class="header-actions">
        <button id="install-button" class="secondary-button" type="button" hidden>Zainstaluj</button>
        <a class="settings-link" href="./#settings" data-route>Ustawienia</a>
      </div>
    </header>

    <nav id="order-controls" class="order-controls" aria-label="Kolejność elementów">
      <span class="order-label">Kolejność</span>
      <div class="order-buttons">
        <button id="order-ascending" class="order-button" type="button" data-order="ascending" aria-label="Kolejność rosnąca" aria-pressed="true" title="Rosnąco">↓</button>
        <button id="order-descending" class="order-button" type="button" data-order="descending" aria-label="Kolejność malejąca" aria-pressed="false" title="Malejąco">↑</button>
        <button id="order-random" class="random-order-button" type="button" data-order="random" aria-pressed="false">Losowo</button>
      </div>
    </nav>

    <main id="home-view" class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Wybierz dźwięk</h1>
      </section>

      <nav id="sound-index" class="sound-index" aria-label="Wybierz dźwięk"></nav>
    </main>

    <main id="exercise-view" class="page-shell" hidden>
      <nav class="page-navigation" aria-label="Nawigacja między dźwiękami">
        <a id="previous-sound" class="page-nav-button" href="#" data-route aria-label="Poprzedni dźwięk">←</a>
        <a class="index-button" href="./" data-route aria-label="Wszystkie dźwięki">Wszystkie</a>
        <a id="next-sound" class="page-nav-button" href="#" data-route aria-label="Następny dźwięk">→</a>
      </nav>

      <section class="intro exercise-intro" aria-labelledby="exercise-title">
        <h1 id="exercise-title" tabindex="-1"></h1>
        <p id="exercise-progress" hidden></p>
      </section>

      <section id="exercise-grid" class="exercise-grid" aria-label="Sylaby"></section>
    </main>

    <main id="settings-view" class="page-shell settings-page" hidden>
      <a class="back-link" href="./" data-route>Wróć do aplikacji</a>
      <section aria-labelledby="settings-title">
        <h1 id="settings-title" tabindex="-1">Ustawienia</h1>
        <div class="settings-row">
          <label for="sound-enabled">Dźwięk</label>
          <input id="sound-enabled" type="checkbox" role="switch" checked>
        </div>
        <div class="settings-row volume-row">
          <label for="volume">Głośność</label>
          <input id="volume" type="range" min="0" max="1" step="0.1" value="1">
        </div>
        <div class="settings-row">
          <span>Wersja</span>
          <output>2026/08/10, 17:30:16</output>
        </div>
      </section>
    </main>

    <audio id="exercise-audio" src="./assets/sounds/pa_papuga.wav" preload="auto"></audio>
    <script src="./app.js" defer></script>
  </body>
</html>
